name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run check:version
      - run: bun run check:format
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=text
      - run: swift test --disable-sandbox --package-path native/SimViewCore
      - name: Audit production dependencies
        run: bun audit --prod

  package:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:build
      - run: bun run smoke:npm
      - name: Real simulator smoke test
        if: ${{ vars.SIMVIEW_SIMULATOR_RUNNER == 'true' }}
        run: ./scripts/real-simulator-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simview-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
