name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:build
      - run: bun run smoke:npm
      - name: Real simulator smoke test
        if: ${{ vars.SIMVIEW_SIMULATOR_RUNNER == 'true' }}
        run: ./scripts/real-simulator-smoke.sh
