name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang-format --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Android agent toolchain
        run: |
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "${GITHUB_ENV}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run check:version
      - run: bun run check:format
      - run: bun run typecheck
      - run: bun run build:test-fixtures
      - run: bun test --coverage --coverage-reporter=text
      - run: swift test --disable-sandbox --package-path native/SimViewCore
      - name: Audit production dependencies
        run: bun audit --prod

  package:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang-format --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Android agent toolchain
        run: |
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "${GITHUB_ENV}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: bun install --frozen-lockfile
      - run: bun run release:build
      - run: bun run smoke:npm
      - name: Real simulator smoke test
        if: ${{ vars.SIMVIEW_SIMULATOR_RUNNER == 'true' }}
        run: ./scripts/real-simulator-smoke.sh
      - name: Real Android smoke test
        if: ${{ vars.SIMVIEW_ANDROID_RUNNER == 'true' }}
        env:
          SIMVIEW_ANDROID_DEVICE_ID: ${{ vars.SIMVIEW_ANDROID_DEVICE_ID }}
          SIMVIEW_ANDROID_INPUT_SMOKE: "1"
          SIMVIEW_ANDROID_ROTATION_SMOKE: "1"
        run: bun run smoke:android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simview-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
